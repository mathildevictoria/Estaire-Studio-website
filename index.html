  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

,7.6vw,128px);max-width:1460px;margin:0 auto;padding-inline:clamp(20px,3.4vw,56px)\">\n      <div style=\"{{ faqGridStyle }}\">\n        <div ref=\"{{ addReveal }}\">\n          <span style=\"font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(48,42,42,.34)\">05 — Good to know<\u002Fspan>\n          <h2 style=\"font-family:'Poppins','Instrument Sans',sans-serif;font-weight:700;letter-spacing:-.024em;line-height:1.02;margin:16px 0 0;font-size:clamp(28px,3.6vw,58px)\">Questions we get first.<\u002Fh2>\n        <\u002Fdiv>\n        <div ref=\"{{ addReveal }}\" style=\"border-top:1px solid rgba(48,42,42,.16)\">\n          <sc-for list=\"{{ faqs }}\" as=\"faq\" hint-placeholder-count=\"6\">\n            <div style=\"border-bottom:1px solid rgba(48,42,42,.09)\">\n              <div sc-camel-on-click=\"{{ faq.toggle }}\" style=\"cursor:pointer;padding-block:clamp(19px,2.2vw,28px);display:flex;justify-content:space-between;align-items:center;gap:24px;font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:-.015em;font-size:clamp(16.5px,1.5vw,22px);line-height:1.3;transition:opacity .3s\" style-hover=\"opacity:.62\">\n                <span>{{ faq.q }}<\u002Fspan>\n                <span style=\"{{ faq.plusStyle }}\">\n                  <span style=\"position:absolute;left:0;right:0;top:6.5px;height:1px;background:#302A2A\"><\u002Fspan>\n                  <span style=\"{{ faq.vertStyle }}\"><\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ faq.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-bottom:clamp(20px,2.2vw,28px);color:rgba(48,42,42,.56);font-size:15.5px;max-width:60ch\">{{ faq.a }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FINAL CTA -->\n    <section id=\"contact\" ref=\"{{ addRevea nent extends DCLogic {\n  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1400, mobileOpen: false, activeId: 'work', openFaqIdx: 0 };\n\n  navData = [\n    { href: '#work', label: 'Our work' },\n    { href: '#process', label: 'The process' },\n    { href: '#services', label: 'Services' },\n    { href: '#pricing', label: 'Our pricing' },\n    { href: '#faq', label: 'FAQ' },\n  ];\n\n  servicesData = [\n    { num: '01', title: 'AI content', desc: 'Create more without constantly producing more. We use AI as a creative production tool to build visuals and videos around your existing brand, products and assets — a single product image can become a full set of campaign visuals.', tags: ['AI product imagery','AI lifestyle visuals','Short-form AI video','Campaign concepts','Social content'], bestFor: 'brands that need a larger volume of visual content without endless photoshoots.', cta: 'Talk about AI content' },\n    { num: '02', title: 'Content repurposing', desc: 'Turn what already exists into content worth publishing. We take webinars, videos, photos, interviews, posts and written material and transform them into a consistent stream of social content.', tags: ['Carousels','Static posts','Reels','Captions','Content calendar'], bestFor: \"brands with valuable existing content that isn't being fully used.\", cta: 'Talk about repurposing' },\n    { num: '03', title: 'Social media management', desc: 'Your content engine, handled for you. A hands-on partnership combining content strategy, production, social media management, filming and AI-assisted creative production.', tags: ['Strategy','Content planning','Filming','AI content','Editing','Posting','Ongoing management'], bestFor: 'brands that want someone to take ownership of their social presence.', cta: 'Talk about management' },\n  ];\n\n  deepDivesData = [\n    { id: 'ai-content', meta: 'AI content', title: 'Realistic AI visuals — no photoshoot needed.', lede: 'We build the AI production around what your brand already owns — the products, the palette, the way you shoot. Every visual is directed and reviewed by a person, so you get volume and variation without the look drifting. Start with three free sample visuals to see how it works.', pairs: [\n      { input: 'One product photo', output: 'A full set of campaign visuals' },\n      { input: 'Your palette and references', output: 'A look that stays consistent' },\n      { input: 'A product page', output: 'Short-form video for reels' },\n    ] },\n    { id: 'repurposing', meta: 'Content repurposing', title: \"Everything you've already made, made to work again.\", lede: 'Webinars, product shoots, interviews, old campaign footage, long-form posts — we go through what you already have, find what still holds up, and cut it into carousels, reels, statics and captions. Same material, used properly.', pairs: [\n      { input: 'One 45-minute webinar', output: 'Six carousels and four reels' },\n      { input: 'A long-form post', output: 'A week of statics and captions' },\n      { input: 'An old campaign shoot', output: 'New cuts that still land' },\n    ] },\n    { id: 'social-management', meta: 'Social media management', title: 'Someone who owns the feed, not just fills it.', lede: 'Strategy, planning, filming, AI production, editing and publishing, running in one monthly rhythm. You see the whole month in one place, say yes or ask for changes, and we handle everything in between — including the parts nobody enjoys, like scheduling, captions and keeping the calendar full.', pairs: [\n      { input: 'One filming day', output: 'A month of content' },\n      { input: 'A rough idea', output: 'A planned, approved calendar' },\n      { input: 'Your yes', output: 'Everything published on time' },\n    ] },\n  ];\n\n  stepsData = [\n    { n: '01', title: 'We get to know the brand', desc: \"Products, tone, audience and everything you've already made. Usually one call and a shared folder.\" },\n    { n: '02', title: 'We build the creative direction', desc: 'A visual direction and a few content angles, so everything that follows looks like it belongs together.' },\n    { n: '03', title: 'We create', desc: 'Filming, AI production, editing and writing — turned into a month of content at a time.' },\n    { n: '04', title: 'You approve. We publish.', desc: 'You see everything before it goes live. Then we schedule, post and keep the feed moving.' },\n  ];\n\n  plansData = [\n    { name: 'Content repurposing', amount: 'From 6.500 kr.', items: ['Turn existing content into new posts', 'From webinars, old posts, images & more', 'Carousels, statics & reels', 'Ready-to-publish content'] },\n    { name: 'AI content', amount: 'From 1.500 kr.', items: ['Realistic AI product & lifestyle imagery', 'Premium short-form AI video', 'Built around your actual products & brand', 'Created to match your brand aesthetic'] },\n    { name: 'Social media management', amount: 'From 10.000 kr.', items: ['Strategy & monthly content planning', 'Content creation & editing', 'Scheduling & publishing', 'Ongoing optimisation & management'] },\n  ];\n\n  faqsData = [\n    { q: 'Can you work with the content we already have?', a: \"That's usually where we start. Webinars, product photos, old campaign footage, long interviews, blog posts — most brands are sitting on more than they think. We go through what you have and tell you honestly what's worth using.\" },\n    { q: 'What do you need from us to get started?', a: \"One call, access to a folder with your existing material, and whoever knows the brand best. That's enough for the first month. We handle the rest.\" },\n    { q: \"Do we see everything before it's published?\", a: \"Always. You get the full month in one place, you approve or ask for changes, and nothing goes live before you've said yes.\" },\n    { q: 'Do you label content made with AI?', a: \"Yes. Where visuals or video are AI-generated or AI-modified, they're marked as such — both because EU rules require it and because we think it's the right way to work. Being open about how something was made has never cost anyone a customer.\" },\n    { q: 'Can we start small and expand later?', a: 'Most brands do. Repurposing is the easiest place to begin, because the raw material already exists. AI content and full management tend to follow once the direction is set.' },\n  ];\n\n  marqueeData = ['AI Visuals', 'Content Repurposing', 'Social Media Management', 'Content that already exists'];\n\n  componentDidMount() {\n    this._reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this._onResize = () => this.setState({ width: window.innerWidth });\n    window.addEventListener('resize', this._onResize);\n\n    this.revealEls = this.revealEls || new Set();\n    this.stepEls = this.stepEls || new Set();\n\n    if (this._reduce) {\n      this.revealEls.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      this.stepEls.forEach(el => { el.style.opacity = '1'; });\n    } else {\n      this._revealObs = new IntersectionObserver((entries) => {\n        entries.forEach(en => {\n          if (en.isIntersecting) { en.target.style.opacity = '1'; en.target.style.transform = 'none'; this._revealObs.unobserve(en.target); }\n        });\n      }, { threshold: .1, rootMargin: '0px 0px -6% 0px' });\n      this.revealEls.forEach(el => this._revealObs.observe(el));\n\n      this._stepObs = new IntersectionObserver((entries) => {\n        entries.forEach(en => { en.target.style.opacity = en.isIntersecting ? '1' : '.34'; });\n      }, { threshold: .5, rootMargin: '-15% 0px -25% 0px' });\n      this.stepEls.forEach(el => this._stepObs.observe(el));\n    }\n\n    this._spyObs = new IntersectionObserver((entries) => {\n      entries.forEach(en => { if (en.isIntersecting) this.setState({ activeId: en.target.id }); });\n    }, { rootMargin: '-45% 0px -45% 0px' });\n    this.navData.forEach(l => {\n      const el = document.getElementById(l.href.slice(1));\n      if (el) this._spyObs.observe(el);\n    });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    if (this._revealObs) this._revealObs.disconnect();\n    if (this._stepObs) this._stepObs.disconnect();\n    if (this._spyObs) this._spyObs.disconnect();\n  }\n\n  addReveal = (el) => {\n    if (!el) return;\n    this.revealEls = this.revealEls || new Set();\n    if (!this.revealEls.has(el)) {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(24px)';\n      el.style.transition = `opacity .9s ${EASE}, transform .9s ${EASE}`;\n      this.revealEls.add(el);\n    }\n  };\n\n  addStep = (el) => {\n    if (!el) return;\n    this.stepEls = this.stepEls || new Set();\n    this.stepEls.add(el);\n  };\n\n  toggleMobile = () => this.setState(s => ({ mobileOpen: !s.mobileOpen }));\n  onNavClick = () => { if (this.state.width <= 1080) this.setState({ mobileOpen: false }); };\n\n  renderVals() {\n    const { width, mobileOpen, activeId, openFaqIdx } = this.state;\n    const isMobile = width <= 1080;\n    const isNarrow = width <= 820;\n\n    const sidebarStyle = isMobile\n      ? 'position:sticky;top:0;z-index:120;width:auto;height:70px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:0 clamp(20px,3.4vw,56px);border-bottom:1px solid rgba(48,42,42,.09);backdrop-filter:blur(14px);background:rgba(247,243,236,.9)'\n      : `position:fixed;left:0;top:0;bottom:0;width:${SIDE};z-index:120;display:flex;flex-direction:column;padding:26px clamp(14px,1.5vw,24px) 30px;background:#F7F3EC;border-right:1px solid rgba(48,42,42,.09)`;\n\n    const logoStyle = isMobile ? 'width:78px;height:auto' : 'width:clamp(80px,7.6vw,112px);height:auto';\n\n    const navStyle = isMobile\n      ? `position:fixed;top:70px;left:0;right:0;margin:0;gap:2px;background:#F7F3EC;padding:18px clamp(20px,3.4vw,56px) 28px;border-bottom:1px solid rgba(48,42,42,.09);display:${mobileOpen ? 'flex' : 'none'};flex-direction:column`\n      : 'display:flex;flex-direction:column;gap:clamp(9px,1.5vh,17px);margin-top:clamp(38px,8vh,86px)';\n\n    const navLinks = this.navData.map(l => {\n      const on = activeId === l.href.slice(1);\n      const base = isMobile\n        ? \"font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.015em;padding-block:6px;transition:color .3s\"\n        : `font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;transition:color .3s,transform .3s ${EASE}`;\n      return { ...l, linkStyle: `${base};color:${on ? '#302A2A' : 'rgba(48,42,42,.56)'}` };\n    });\n\n    const socialWrapStyle = isMobile\n      ? 'display:flex;flex-direction:row;gap:18px'\n      : 'display:flex;flex-direction:column;gap:17px;margin-top:auto;padding-top:36px';\n\n    const heroBottomStyle = `display:${isMobile ? 'flex' : 'grid'};${isMobile ? 'flex-direction:column;' : 'grid-template-columns:minmax(0,1fr) auto;align-items:end;'}gap:clamp(24px,3vw,44px);margin-top:clamp(30px,3.4vw,50px)`;\n\n    const specCols = isNarrow ? 1 : 3;\n    const specGridStyle = `display:grid;grid-template-columns:repeat(${specCols},1fr);gap:clamp(12px,1.3vw,20px);margin-top:clamp(40px,5vw,80px)`;\n\n    const svcGridStyle = isMobile\n      ? 'display:grid;grid-template-columns:44px 1fr;gap:18px'\n      : 'display:grid;grid-template-columns:56px minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(20px,3vw,56px);align-items:start';\n\n    const pairRowStyle = isNarrow\n      ? 'display:grid;grid-template-columns:1fr;gap:14px;padding-block:clamp(22px,2.6vw,34px);border-bottom:1px solid rgba(48,42,42,.09)'\n      : 'display:grid;grid-template-columns:minmax(0,.72fr) 40px minmax(0,1.28fr);gap:clamp(18px,2.4vw,40px);align-items:end;padding-block:clamp(22px,2.6vw,36px);border-bottom:1px solid rgba(48,42,42,.09)';\n\n    const howGridStyle = `display:grid;grid-template-columns:${isMobile ? '1fr' : 'minmax(0,.8fr) minmax(0,1.2fr)'};gap:clamp(28px,4.4vw,78px);align-items:start`;\n    const howStickyStyle = isMobile ? '' : 'position:sticky;top:60px';\n    const priceGridStyle = `display:grid;grid-template-columns:${isMobile ? '1fr' : 'repeat(3,1fr)'};gap:clamp(14px,1.6vw,24px)`;\n    const faqGridStyle = `display:grid;grid-template-columns:${isMobile ? '1fr' : 'minmax(0,.7fr) minmax(0,1.3fr)'};gap:clamp(28px,4.4vw,78px);align-items:start`;\n\n    const faqs = this.faqsData.map((f, i) => ({\n      q: f.q, a: f.a, open: openFaqIdx === i,\n      toggle: () => this.setState(s => ({ openFaqIdx: s.openFaqIdx === i ? -1 : i })),\n      plusStyle: 'position:relative;flex:0 0 auto;width:14px;height:14px',\n      vertStyle: `position:absolute;top:0;bottom:0;left:6.5px;width:1px;background:#302A2A;transition:transform .4s ${EASE};transform:rotate(${openFaqIdx === i ? '90' : '0'}deg)`,\n    }));\n\n    return {\n      isMobile, showSocial: !isNarrow, sidebarStyle, logoStyle, navStyle, navLinks, socialWrapStyle,\n      mainStyle: `padding-left:${isMobile ? '0' : SIDE}`,\n      heroBottomStyle, specGridStyle, svcGridStyle, pairRowStyle,\n      svcRightStyle: `display:flex;flex-direction:column;gap:22px;padding-top:.4em${isMobile ? ';grid-column:2' : ''}`,\n      howGridStyle, howStickyStyle, priceGridStyle, faqGridStyle,\n      arrowGlyph: '⟶',\n      toggleMobile: this.toggleMobile, onNavClick: this.onNavClick,\n      addReveal: this.addReveal, addStep: this.addStep,\n      services: this.servicesData, deepDives: this.deepDivesData, steps: this.stepsData,\n      plans: this.plansData, faqs, marqueeItems: this.marqueeData,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
