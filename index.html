<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estaire Studio | New website coming soon</title>
<meta name="description" content="Estaire Studio is working on a new website. Get in touch at mail@estairestudio.com.">
<link rel="icon" href="/assets/estaire-logo.png">
<link rel="preload" href="/assets/fonts/instrument-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/instrument-sans-400-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/instrument-sans-600-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/instrument-sans-700-latin.woff2) format("woff2")}

:root{
  --canvas:#fbf9f7;
  --ink:#171314;
  --muted:#6d6563;
  --line:#ebe4df;
  --accent-deep:#7c1d1a;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh}
a{color:inherit;text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.inner{max-width:560px}
.logo{height:64px;width:auto}
.eyebrow{margin:40px 0 0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep)}
h1{margin:14px 0 0;font-size:clamp(36px,6vw,56px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
p.lede{margin:18px auto 0;max-width:30rem;color:var(--muted);font-size:17px;line-height:1.6}
.mail{display:inline-flex;align-items:center;height:52px;margin-top:32px;padding:0 28px;border-radius:999px;background:var(--accent-deep);color:#fff;font-weight:600;font-size:16px;transition:background .25s}
.mail:hover{background:#5e1513}
footer{padding:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<!-- Midlertidig forside. Den tidligere hjemmeside ligger paa /ai (password). -->
<main>
  <div class="inner">
    <img class="logo" src="/assets/estaire-logo-full.png" alt="Estaire Studio" width="1110" height="450">
    <p class="eyebrow">New website</p>
    <h1>Coming soon.</h1>
    <p class="lede">We're working on something new. In the meantime, we'd love to hear from you.</p>
    <a class="mail" href="mailto:mail@estairestudio.com">mail@estairestudio.com</a>
  </div>
</main>
<footer>© <span id="year">2026</span> Estaire Studio · CVR/VAT: DK43394967</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
